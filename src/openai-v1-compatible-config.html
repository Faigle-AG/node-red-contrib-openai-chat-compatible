<script type="text/javascript">
    RED.nodes.registerType('openai-v1-compatible-config', {
        category: 'config',
        defaults: {
            name: { value: '' },
            baseUrl: {
                value: 'https://api.openai.com/v1',
                required: true,
                validate: function (v) {
                    if (!v || v.trim() === '') return false;
                    var validator = RED.validators.typedInput('baseUrlType');
                    return validator.call(this, v);
                },
            },
            baseUrlType: { value: 'str' },
            apiKeySource: { value: 'credentials', required: true },
            apiKeyEnv: {
                value: 'OPENAI_API_KEY',
                validate: function (v) {
                    return (
                        this.apiKeySource !== 'env' ||
                        (typeof v === 'string' && v.trim().length > 0)
                    );
                },
            },
            maxRetries: {
                value: 4,
                required: true,
                validate: function (v) {
                    return Number.isInteger(Number(v)) && Number(v) >= 0 && Number(v) <= 10;
                },
            },
            timeoutMs: {
                value: 120000,
                required: true,
                validate: function (v) {
                    return (
                        Number.isInteger(Number(v)) && Number(v) >= 1000 && Number(v) <= 2147483647
                    );
                },
            },
            enableLogging: { value: false },
        },
        credentials: { apiKey: { type: 'password' } },
        label: function () {
            return this.name || this.baseUrl || 'OpenAI Compatible';
        },
        oneditprepare: function () {
            $('#node-config-input-baseUrl').typedInput({
                default: 'str',
                types: ['str', 'env'],
                typeField: $('#node-config-input-baseUrlType'),
            });

            function updateApiKeySource() {
                var source = $('#node-config-input-apiKeySource').val();
                $('#openai-v1-api-key-credentials-row').toggle(source === 'credentials');
                $('#openai-v1-api-key-env-row').toggle(source === 'env');
            }

            $('#node-config-input-apiKeySource')
                .off('change.openaiV1')
                .on('change.openaiV1', updateApiKeySource);
            updateApiKeySource();
        },
    });
</script>

<script type="text/markdown" data-help-name="openai-v1-compatible-config">
Shared connection configuration for **OpenAI V1 Compatible** nodes.

### Connection

- **Base URL** _string | env_  
  OpenAI-compatible API base URL, usually ending in `/v1`. The node appends `/chat/completions` unless the configured URL already ends with it.

### Authentication

- **Stored credential** stores the API key using Node-RED credentials. Enter only the key, without `Bearer`.
- **Environment variable** resolves the configured environment variable for every request. The default is `OPENAI_API_KEY`.
- **None** sends no `Authorization` header.

### Runtime

- **Max Retries** defaults to `4`; range `0` to `10`.
- **Timeout (ms)** defaults to `120000` and applies to each HTTP attempt.
- **Enable request metadata logging** logs retry/timeout metadata without logging the endpoint, model, prompt, or API key.

Use one configuration node per endpoint/authentication combination and reuse it across multiple processing nodes/models.
</script>
